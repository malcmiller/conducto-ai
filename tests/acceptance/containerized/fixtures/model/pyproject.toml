[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_fixture"]

[tool.hatch.build.targets.sdist]
include = ["src/model_fixture", "pyproject.toml"]

[project]
name = "model-fixture"
version = "0.1.0"
description = "Deterministic OpenAI-compatible model test double for the Conducto containerized acceptance suite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
