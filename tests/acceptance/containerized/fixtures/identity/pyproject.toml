[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_fixture"]

[tool.hatch.build.targets.sdist]
include = ["src/identity_fixture", "pyproject.toml"]

[project]
name = "identity-fixture"
version = "0.1.0"
description = "Deterministic OAuth/JWKS identity test double for the Conducto containerized acceptance suite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "cryptography>=42",
]
