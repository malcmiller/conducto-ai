[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conducto"]

[tool.hatch.build.targets.sdist]
include = ["src/conducto", "README.md", "LICENSE", "pyproject.toml"]

[project]
name = "conducto-ai"
version = "0.1.2"
description = "A capability-first Python framework for building governed multi-agent systems"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
authors = [
    { name = "Malcolm Miller" },
]
license = { file = "LICENSE" }
keywords = [
    "a2a",
    "agents",
    "ai",
    "governance",
    "multi-agent",
    "orchestration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "a2a-sdk==1.1.5",
    "cryptography>=44.0.0",
    "packaging>=24.0",
    "protobuf==7.36.2",
    "pydantic>=2.13.5",
]

[project.urls]
Homepage = "https://github.com/malcmiller/conducto-ai"
Documentation = "https://github.com/malcmiller/conducto-ai/tree/main/docs"
Issues = "https://github.com/malcmiller/conducto-ai/issues"
Repository = "https://github.com/malcmiller/conducto-ai"

[project.optional-dependencies]
registration = [
    "httpx>=0.28.1,<1.0",
]
mcp = [
    "mcp==2.2.0",
]
a2a-server = [
    "a2a-sdk[http-server]==1.1.5",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
]
ollama = [
    "httpx>=0.28.1,<1.0",
    "ollama>=0.5",
]
openai = [
    "httpx>=0.28.1,<1.0",
    "openai>=1.0",
]
microsoft-foundry = [
    "azure-ai-projects>=1.0.0b11",
    "azure-identity>=1.17",
]
test = [
    "pytest>=9.1.1",
]
opentelemetry = [
    "opentelemetry-api==1.37.0",
    "opentelemetry-sdk==1.37.0",
]

[dependency-groups]
dev = [
    "conducto-ai[a2a-server,mcp,opentelemetry,test]",
    "mypy>=1.14",
    "ruff>=0.9",
    "types-protobuf==7.35.1.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP040", "UP047"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
packages = ["conducto"]
mypy_path = "src"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "acceptance: Milestone 1 quick-start acceptance flow (stable aggregate check).",
    "golden: Schema/golden-fixture tests pinning public wire contracts.",
    "ollama: Opt-in tests against an already running local Ollama daemon.",
    "vllm: Opt-in tests against an already running local vLLM OpenAI-compatible server.",
    "lm_studio: Opt-in tests against an already running local LM Studio OpenAI-compatible server.",
]

[tool.uv.sources]
conducto-ai = { workspace = true }
