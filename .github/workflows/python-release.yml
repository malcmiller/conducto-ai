name: Python release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the selected protected v<version> tag (otherwise rehearse only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate release commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      - name: Verify clean checkout and exact tag version
        run: |
          test -z "$(git status --porcelain)"
          uv run --locked python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            uv run --locked python -c "import tomllib, os, re; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; tag=os.environ['GITHUB_REF_NAME']; assert re.fullmatch(r'v'+re.escape(version), tag), f'{tag} does not equal v{version}'"
            test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
            if [ "${{ github.event_name }}" = "push" ]; then
              test "${{ github.event.created }}" = "true"
              test "${{ github.event.forced }}" != "true"
              test "${{ github.event.before }}" = "0000000000000000000000000000000000000000"
              release_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
                -H "Authorization: Bearer ${{ github.token }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")"
              if [ "$release_status" = "200" ]; then
                echo "GitHub Release already exists for $GITHUB_REF_NAME; refusing tag reuse"
                exit 1
              fi
              test "$release_status" = "404"
            fi
          fi
      - name: Install locked development environment
        run: uv sync --locked --group dev
      - name: Format, lint, type-check, and test
        run: |
          uv run ruff format .
          git diff --exit-code
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src examples scripts tests/acceptance
          uv run pytest

  build:
    name: Build and inspect immutable artifacts
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      wheel: ${{ steps.files.outputs.wheel }}
      sdist: ${{ steps.files.outputs.sdist }}
      wheel_sha256: ${{ steps.digest.outputs.wheel_sha256 }}
      sdist_sha256: ${{ steps.digest.outputs.sdist_sha256 }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Build exactly once
        run: |
          rm -rf dist release
          uv build
      - name: Inspect package contents and generate supply-chain files
        run: |
          wheel="$(ls dist/*.whl)"
          sdist="$(ls dist/*.tar.gz)"
          uv run --no-project python scripts/release_verify.py --wheel "$wheel" --sdist "$sdist" --output-dir release
      - name: Verify installed wheel quick start and smoke test
        run: |
          wheel="$(ls dist/*.whl)"
          uv run --no-project --with "$wheel" python examples/quickstart.py
          uv run --no-project --with "$wheel" python scripts/smoke_test.py
      - name: Verify sdist rebuilds the same version
        run: |
          mkdir isolated
          tar -xzf dist/*.tar.gz -C isolated
          (cd isolated/* && uv build --out-dir "$GITHUB_WORKSPACE/rebuilt")
          test "$(ls rebuilt/*.whl | xargs -n1 basename | sort)" = "$(ls dist/*.whl | xargs -n1 basename | sort)"
      - name: Record immutable filenames and digests
        id: files
        run: |
          echo "wheel=$(basename "$(ls dist/*.whl)")" >> "$GITHUB_OUTPUT"
          echo "sdist=$(basename "$(ls dist/*.tar.gz)")" >> "$GITHUB_OUTPUT"
      - name: Record digests
        id: digest
        run: |
          echo "wheel_sha256=$(sha256sum dist/*.whl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sdist_sha256=$(sha256sum dist/*.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Read canonical version
        id: version
        run: echo "version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - name: Upload exact release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conducto-ai-release-${{ steps.version.outputs.version }}-${{ steps.digest.outputs.wheel_sha256 }}-${{ steps.digest.outputs.sdist_sha256 }}
          path: |
            dist/*
            release/*
          if-no-files-found: error
          retention-days: 90

  optional-extras:
    name: Installed extra (${{ matrix.extra }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: registration
            module: httpx
          - extra: mcp
            module: mcp
          - extra: opentelemetry
            module: opentelemetry
          - extra: ollama
            module: ollama
          - extra: openai
            module: openai
          - extra: microsoft-foundry
            module: azure.ai.projects
          - extra: test
            module: pytest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conducto-ai-release-${{ needs.build.outputs.version }}-${{ needs.build.outputs.wheel_sha256 }}-${{ needs.build.outputs.sdist_sha256 }}
          path: release-bundle
      - name: Install wheel with only one optional extra
        run: |
          wheel="$(ls release-bundle/dist/*.whl)"
          uv run --no-project --with "$wheel[${{ matrix.extra }}]" python -c "import importlib; from importlib.metadata import metadata; import conducto; extra='${{ matrix.extra }}'; assert extra in metadata('conducto-ai').get_all('Provides-Extra', []); importlib.import_module('${{ matrix.module }}'); print(conducto.__file__)"
          uv run --no-project --with "$wheel[${{ matrix.extra }}]" python scripts/smoke_test.py

  prepublish:
    name: Check PyPI version availability
    needs: [build, optional-extras]
    if: >-
      github.ref_type == 'tag' &&
      (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse an existing immutable PyPI version
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/conducto-ai/${{ needs.build.outputs.version }}/json")"
          test "$status" = "404" || { echo "conducto-ai ${{ needs.build.outputs.version }} already exists or PyPI is unavailable ($status)"; exit 1; }

  publish:
    name: Publish through PyPI Trusted Publishing
    needs: [build, optional-extras, prepublish]
    if: >-
      github.ref_type == 'tag' &&
      (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/conducto-ai/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conducto-ai-release-${{ needs.build.outputs.version }}-${{ needs.build.outputs.wheel_sha256 }}-${{ needs.build.outputs.sdist_sha256 }}
          path: release-bundle
      - name: Recheck verified artifact digests
        run: |
          cd release-bundle/dist
          sha256sum -c ../release/SHA256SUMS
      - name: Publish exact verified files
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-bundle/dist
          skip-existing: false
      - name: Attest exact release files
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.2
        with:
          subject-path: |
            release-bundle/dist/*.whl
            release-bundle/dist/*.tar.gz

  github-release:
    name: Create GitHub Release
    needs: [build, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conducto-ai-release-${{ needs.build.outputs.version }}-${{ needs.build.outputs.wheel_sha256 }}-${{ needs.build.outputs.sdist_sha256 }}
          path: release-bundle
      - name: Create release with generated notes
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: |
            release-bundle/dist/*
            release-bundle/release/*
