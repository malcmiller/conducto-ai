# Python CI for the `conducto-ai` repository.
#
# Every command run here also runs locally with plain `uv` commands from a
# clean repository checkout (see README.md), so contributors
# can reproduce any failure without needing GitHub Actions.
#
# Design notes:
#   - Third-party actions are pinned to immutable commit SHAs (not tags) to
#     resist supply-chain tampering. The `# vX.Y.Z` comment records the
#     release the SHA corresponds to for humans/renovate-style tooling.
#   - The `required` job is the one status check that should be marked
#     "required" in branch protection / repository rulesets: it always runs
#     and fails if any dependency failed or was canceled.
#   - No job requests write permissions, and no publishing credentials are
#     used anywhere in this workflow.
name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel superseded pull-request runs but never cancel an in-progress run
  # against a protected branch (main) triggered by push.
  group: python-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('branch-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Supported/documented Python & OS matrix (kept in sync with the `matrix:`
  # blocks below and README.md). GitHub Actions cannot expand
  # `env.*` inside `strategy.matrix`, so the matrix values are duplicated per
  # job rather than referenced from here; update both together.
  PYTHON_VERSIONS: "3.12, 3.13"
  OPERATING_SYSTEMS: "ubuntu-latest, windows-latest"

jobs:
  quality:
    name: Format, lint & type-check (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (locked, reproducible)
        run: uv sync --locked --group dev
      - name: Check formatting (ruff format)
        run: uv run ruff format --check .
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Static type-check (mypy)
        run: uv run mypy src examples scripts tests/acceptance

  test:
    name: Unit & schema/golden tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (locked, reproducible)
        run: uv sync --locked --group dev
      - name: Run unit & schema/golden tests
        run: |
          mkdir -p reports
          uv run pytest -m "not acceptance" \
            --junit-xml=reports/pytest-results.xml \
            -o junit_family=legacy
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/pytest-results.xml
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    name: Milestone 1 quick-start acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      - name: Install dependencies (locked, reproducible)
        run: uv sync --locked --group dev
      - name: Run Milestone 1 quick-start acceptance suite
        run: |
          mkdir -p reports
          uv run pytest -m acceptance \
            --junit-xml=reports/pytest-acceptance.xml \
            -o junit_family=legacy
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-acceptance-${{ matrix.os }}
          path: reports/pytest-acceptance.xml
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Build & installed-wheel smoke test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel
        run: |
          rm -rf dist
          uv build
      - name: Installed-wheel quickstart (clean, no dev dependencies)
        run: |
          wheel="$(ls dist/*.whl)"
          uv run --no-project --with "$wheel" python examples/quickstart.py
      - name: Installed-wheel smoke test (clean, no dev dependencies)
        run: |
          wheel="$(ls dist/*.whl)"
          uv run --no-project --with "$wheel" python scripts/smoke_test.py
      - name: Upload built distributions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist
          if-no-files-found: warn
          retention-days: 14

  required:
    # This is the single, stable status check to mark as "required" in
    # branch protection / repository rulesets for the `main` branch.
    name: Python CI (required)
    needs: [quality, test, acceptance, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed or was cancelled
        run: |
          echo "quality:    ${{ needs.quality.result }}"
          echo "test:       ${{ needs.test.result }}"
          echo "acceptance: ${{ needs.acceptance.result }}"
          echo "package:    ${{ needs.package.result }}"
        shell: bash
      - name: Fail aggregate check on any failure or cancellation
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
        shell: bash
